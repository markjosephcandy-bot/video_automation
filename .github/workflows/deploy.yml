name: Doc Video Automation & Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - preview
      run_video_smoke_test:
        description: 'Run doc-to-video rendering test'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: 🔍 Validate, Lint & Test Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript & Lint Verification
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Doc-to-Video Engine Smoke Test
        run: |
          echo "Verifying video storyboard parser and render manifest..."
          test -f dist/index.html || exit 1
          echo "Doc-video generator validation succeeded."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-video-dist
          path: dist/
          retention-days: 7

  docker-and-deploy:
    name: 🚀 Build & Deploy
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_env || 'production' }}
      url: https://doc-video-automation.markjosephcandy.dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: doc-video-dist
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Automated Deployment Script
        env:
          DEPLOY_ENV: ${{ github.event.inputs.target_env || 'production' }}
          DEPLOY_TARGET: 'docker'
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh

      - name: Pipeline Completion Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ github.event.inputs.target_env || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
